      provisions: >-
        Art. 1, Art. 2(1) to (3), Art. 3, point (3), Art. 4, Art. 5(13) and (15), and Arts 14, 15, 16, 34,
        35, 41, 43, 47, 48 and 49 (Art. 50(2))
    - date: "2027-10-17"
      partial: false
      provisions: "The remaining provisions (Art. 50(3))"
  sources:
    - {label: "Regulation (EU) 2026/2280, Article 50", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R2280"}
  reviewed: "2026-10-23"

- celex: "32021R0768"  # Own resources implementing measures (2018/0132(APP))
  reason: >-
    EUR-Lex records entry into force on 1 January 2021, the date from which the Regulation applies. Article 9
    ties its entry into force to that of Decision (EU, Euratom) 2020/2053, which EUR-Lex records as 1 June
    2021; the Regulation applies retroactively from 1 January 2021.
  entry_into_force: "2021-06-01"
  application:
    - date: "2021-01-01"
      partial: false
      provisions: "The Regulation in general, retroactively (Art. 9)"
  sources:
    - {label: "Regulation (EU, Euratom) 2021/768, Article 9", url: "https://eur-lex.europa.eu/eli/reg/2021/768/oj"}
    - {label: "Decision (EU, Euratom) 2020/2053, Article 12", url: "https://eur-lex.europa.eu/eli/dec/2020/2053/oj"}
  reviewed: "2026-10-23"

- celex: "32015D0457"  # Repeal of the terrorism-prevention programme decision (2013/0281(APP))
