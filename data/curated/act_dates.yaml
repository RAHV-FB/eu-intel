  sources:
    - {label: "Regulation (EU, Euratom) No 608/2014, Article 9", url: "https://eur-lex.europa.eu/eli/reg/2014/608/oj"}
    - {label: "Decision 2014/335/EU, Euratom, Article 11", url: "https://eur-lex.europa.eu/eli/dec/2014/335/oj"}
