# Transposition dates explained, none changed: the reason is shown with the act's dates.

- celex: "32016L0797"  # Railway Interoperability Directive
  reason: >-
    Article 57(1) sets 16 June 2019. Article 57(2) let Member States extend that period by one year, and seventeen
    did so, to 16 June 2020. Directive (EU) 2020/700 added Article 57(2a): those Member States could extend it
    again, until 31 October 2020, and apply their measures from that date. 31 October 2020 is that optional
    extension, not a deadline for specific provisions.
  sources:
    - {label: "Directive (EU) 2016/797 (OJ L 138, 26.5.2016)", url: "https://eur-lex.europa.eu/eli/dir/2016/797/oj"}
    - {label: "Directive (EU) 2020/700, Article 1 and recitals 2 and 6", url: "https://eur-lex.europa.eu/eli/dir/2020/700/oj"}
  reviewed: "2026-10-23"

