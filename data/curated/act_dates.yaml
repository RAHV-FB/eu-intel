    EUR-Lex records entry into force on 21 May 2014, the day Regulation (EU) No 513/2014 entered into force.
    As that Regulation entered into force before this Decision was published (20 March 2015), Article 3(2)
    applies: entry into force on the day following publication, 21 March 2015.
  entry_into_force: "2015-03-21"
  sources:
    - {label: "Decision (EU, Euratom) 2015/457, Article 3", url: "https://eur-lex.europa.eu/eli/dec/2015/457/oj"}
    - {label: "Regulation (EU) No 513/2014, Article 16", url: "https://eur-lex.europa.eu/eli/reg/2014/513/oj"}
  reviewed: "2026-10-23"

