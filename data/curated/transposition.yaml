- celex: "32016L0797"  # Railway Interoperability Directive
  deadline: "2019-06-16"
  other: ["2020-10-31"]
  provision: "Art. 57(1)"
  quote: >-
    Member States shall bring into force the laws, regulations and administrative provisions necessary to comply
    with Articles 1 and 2, Article 7(1) to (4) and (6), [...] Article 54 and Annexes I, II, III and IV by 16 June
    2019.
  note: >-
    31 October 2020: Article 57(2a), inserted by Directive (EU) 2020/700: Member States that had extended the
    transposition period by one year under Article 57(2) "may further extend it until 31 October 2020" and apply
    their measures from that date. An optional extension of the whole period, not a deadline for specific
    provisions.
  source: {label: "Directive (EU) 2016/797, Article 57; Directive (EU) 2020/700, Article 1", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016L0797"}
  reviewed: "2026-10-23"
  # Art. 57(2): "Member States may extend the transposition period referred to in paragraph 1 by one year";
  # Art. 57(2a) (Directive (EU) 2020/700, Art. 1(2)): "Member States that have extended the transposition period in
  # accordance with paragraph 2 may further extend it until 31 October 2020"
  exceptions: >-
    Member States that extended the transposition period by one year under Art. 57(2) had until 16 June 2020, and
    those that then extended it further under Art. 57(2a), inserted by Directive (EU) 2020/700, had until
    31 October 2020. Under Art. 57(5), the obligation to transpose and implement the articles it lists does not
    apply to Cyprus and Malta for as long as no rail system is established within their territories; once an
    official application to build a railway line is submitted, they must put in place measures implementing those
    articles within two years of its receipt.
  exemption:
    named: ["CY", "MT"]
    provision: "Art. 57(5)"
    quote: >-
      The obligation to transpose and implement Article 13, Article 14(1) to (8), (11) and (12), Article 15(1) to
      (9), Article 16(1), Articles 19 to 26, Articles 45, 46 and 47, Article 49(1) to (4) and Article 54 of this
      Directive shall not apply to Cyprus and Malta for as long as no rail system is established within their
      territories. However, as soon as a public or private entity submits an official application to build a
      railway line with a view to its operation by one or more railway undertakings, the Member States concerned
      shall put in place measures to implement the Articles referred to in the first subparagraph within two years
      of receipt of the application.

- celex: "32016L0798"  # Railway Safety Directive
  deadline: "2019-06-16"
  other: ["2020-10-31"]
  provision: "Art. 33(1)"
  quote: >-
    Member States shall bring into force the laws, regulations and administrative provisions necessary to comply
    with Articles 2, 3, 4, Articles 8 to 11, [...] Article 26(3) and Annexes II and III by 16 June 2019.
  note: >-
    31 October 2020: Article 33(2a), inserted by Directive (EU) 2020/700: Member States that had extended the
    transposition period by one year under Article 33(2) "may further extend it until 31 October 2020" and apply
    their measures from that date. An optional extension of the whole period, not a deadline for specific
    provisions.
  source: {label: "Directive (EU) 2016/798, Article 33; Directive (EU) 2020/700, Article 2", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016L0798"}
  reviewed: "2026-10-23"
  # Art. 33(2): "Member States may extend the transposition period referred to in paragraph 1 by 1 year";
  # Art. 33(2a) (Directive (EU) 2020/700, Art. 2(5)): "Member States that have extended the transposition period in
  # accordance with paragraph 2 may further extend it until 31 October 2020"
  exceptions: >-
    Member States that extended the transposition period by one year under Art. 33(2) had until 16 June 2020, and
    those that then extended it further under Art. 33(2a), inserted by Directive (EU) 2020/700, had until
    31 October 2020. Under Art. 33(4), the obligation to transpose and implement the directive does not apply to
    Cyprus and Malta for as long as no rail system is established within their territories; once an official
    application to build a railway line is submitted, they must put in place measures to implement it within two
    years of its receipt.
  exemption:
    countries: ["CY", "MT"]
    country_note: >-
      for as long as no rail system is established within its territory (measures are due within two years of an
      official application to build a railway line)
    provision: "Art. 33(4)"
    quote: >-
      The obligation to transpose and implement this Directive shall not apply to Cyprus and Malta for as long as
      no rail system is established within their territories. However, as soon as a public or private entity
      submits an official application to build a railway line with a view to its operation by one or more railway
      undertakings, the Member States concerned shall put in place measures to implement this Directive within 2
      years of the receipt of the application.

