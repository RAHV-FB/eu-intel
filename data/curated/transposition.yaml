# A directive's transposition dates as its own text sets them, where EUR-Lex (Cellar) annotations cannot tell.
#
# Cellar records every date of a directive's transposition article under one property and labels most of
# them (ADOPTION / APPLICATION / "at the latest") with the article setting them, but it does not say which
# date is the general deadline. pipeline/analysis/transposition.py takes the deadline whose article reference
# comes first in the text and, when several share it, the earliest one. The earliest is wrong when the first
# date is a derogation for a few provisions: Directive (EU) 2024/1640, Art. 78(1), sets 10 July 2027 for the
# Directive and 10 July 2025 for Article 74 only, and Cellar gives "Art. 78(1)" for both. Each entry states,
# in the build only, which of the act's recorded dates is the general deadline; the snapshot keeps the source
# values. validate.py lists every directive with several deadlines that has no entry here and whose article
# references do not decide. A directive that sets staged deadlines and none for "this Directive" as a whole
# (e.g. Directive (EU) 2017/2455) has its first stage as general deadline; the later stages are shown as
# deadlines for specific provisions.
#
# Fields:
#   celex         the directive (sector-3 CELEX)
#   deadline      the general transposition deadline; must be one of the dates EUR-Lex records for the act
#   applies_from  optional; the general date from which the national measures apply, where Cellar's labels
#                 cannot tell (one of the recorded dates)
#   other         optional; recorded dates that are neither a transposition deadline nor a firm date from which
#                 national measures apply (e.g. a conditional or optional date); shown neutrally as dates recorded
#                 by EUR-Lex, and kept off the timeline
#   provision     the provision setting the general deadline
#   quote         that provision, verbatim (long lists of articles shortened with [...])
#   note          optional; what the act's other recorded dates are
#   exemption     optional: the directive's own provision exempting Member States from transposing it, quoted in full
#                 (every subparagraph): {provision, quote, countries, country_note, named}.
#                 countries: only when the provision names them and exempts them from the whole directive, or the
#                 directive is not addressed to them; their rows show "Not required by the directive", and their country
#                 pages add "<provision>: <country_note>" (the condition, e.g. "for as long as no rail system is
#                 established within its territory", or "the directive is not addressed to it").
#                 named: the countries a provision names but exempts from some articles only (Directive (EU) 2016/797,
#                 Art. 57(5)); their rows are not marked, and the page says the exemption covers those articles only.
#                 Without either (a condition that names no country) the provision is quoted on the page, which says
#                 that "No measures found" may reflect it
#   exceptions    optional: what the directive's own text provides for some Member States beside the general deadline
#                 (an extension of the transposition period, an exemption, a lighter obligation), in plain words naming
#                 each provision, checked against the text. The next step then reads "... by then, except as its text
#                 provides. <exceptions>", and the deadline's timeline step gives it. A directive binds only the Member
#                 States to which it is addressed (Art. 288 TFEU), but it can still exempt some of them or give them
#                 more time: without this, "the Member States bound by the directive were required to adopt national
#                 measures by then" would claim more than the text says (Directive (EU) 2016/798, Art. 33(2), (2a), (4))
#   amends        optional, for an amending directive: which of its deadlines covers its changes to each directive it
#                 amends, as its transposition article sets them: [{celex, provision (its article making the
#                 changes), deadline, further: [{date, provisions}] (later deadlines for some of those changes)}];
#                 every date must be one EUR-Lex records for the amending directive. The amended directive's next
#                 step names only these deadlines (Directive (EU) 2026/470, Art. 5(1): Articles 1 to 3 by 19 March
#                 2027, Article 4, which amends Directive (EU) 2024/1760, by 26 July 2028)
#   source        {label, url} the text checked (Cellar, English)
#   reviewed      date of the check
#
# Last full review: 2026-10-23 (every directive with several transposition deadlines whose general deadline the
# article references do not decide).

