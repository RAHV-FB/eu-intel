- celex: "32017L2397"  # Professional qualifications in inland navigation
  deadline: "2022-01-17"
  provision: "Art. 39(1), first subparagraph"
  quote: >-
    Member States shall bring into force the laws, regulations and administrative provisions necessary to comply
    with this Directive by 17 January 2022.
  # Art. 39(2) and (3): such a Member State "shall only be obliged to bring into force those measures which are
  # necessary to ensure compliance with" the provisions listed, "by 17 January 2022"
  exceptions: >-
    A Member State in which all persons referred to in Articles 4(1), 5(1) and 6 operate exclusively on national
    inland waterways not linked to the navigable network of another Member State (Art. 39(2)), or in which all
    persons are exempted under Art. 2(3) (Art. 39(3)), had to bring into force by then only the measures those
    paragraphs list. Under Art. 39(4), a Member State is not obliged to transpose the directive as long as inland
    waterway navigation is not technically possible on its territory.
  exemption:
    provision: "Art. 39(4)"
    quote: >-
      By way of derogation from paragraph 1 of this Article, a Member State shall not be obliged to transpose this
      Directive as long as inland waterway navigation is not technically possible on its territory. Such Member
      State may not issue Union certificates of qualification or approve training programmes or simulators until it
      has transposed and implemented the provisions of this Directive and informed the Commission that it has done
      so.
  source: {label: "Directive (EU) 2017/2397, Article 39", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32017L2397"}
  reviewed: "2026-10-23"

