# General search synonyms: standard abbreviations and official short names used by the EU
# institutions themselves (EUR-Lex titles, Commission/EP/Council pages). No informal nicknames here;
# dossier-specific common names live in featured.yaml `aliases`, each with its own justification.
#
# Semantics: when a query token/phrase matches one of `terms` (case-insensitive, whole word/phrase),
# search also matches the phrases in `expands_to`. Expansion is one-directional and not recursive.

# ------------------------------------------------------------------ institutions & procedure
- {terms: ["eu"], expands_to: ["european union"]}
- {terms: ["ep", "europarl"], expands_to: ["european parliament"]}
- {terms: ["mep", "meps"], expands_to: ["member of the european parliament"]}
- {terms: ["cjeu"], expands_to: ["court of justice of the european union"]}
- {terms: ["ecb"], expands_to: ["european central bank"]}
- {terms: ["oj", "ojeu"], expands_to: ["official journal of the european union"]}
- {terms: ["olp", "codecision", "cod"], expands_to: ["ordinary legislative procedure"]}
- {terms: ["trilogue", "trilogues"], expands_to: ["interinstitutional negotiations", "provisional agreement"]}
- {terms: ["qmv"], expands_to: ["qualified majority"]}
- {terms: ["mff"], expands_to: ["multiannual financial framework"]}
- {terms: ["cwp"], expands_to: ["commission work programme"]}

