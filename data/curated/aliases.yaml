# ===================================================================== names of individual files
# Entries {procedure, names} attach common names to ONE legislative file (by procedure reference).
# A name is added only when an official source uses it for that file: the act's own title, the
# Commission's or the European Parliament's own pages, or the EP Legislative Train. Each entry is
# preceded by "# source:" lines citing those pages. No informal, partisan or evaluative nicknames.
# (Short titles in an act's own Official Journal title and Legislative Train file names are added
# automatically by pipeline/build.py; files with curated entries in featured.yaml keep those aliases.)

