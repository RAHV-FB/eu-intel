- {terms: ["ets2"], expands_to: ["emissions trading system for buildings, road transport and additional sectors"]}
- {terms: ["cbam"], expands_to: ["carbon border adjustment mechanism"]}
- {terms: ["ghg"], expands_to: ["greenhouse gas"]}
- {terms: ["co2"], expands_to: ["carbon dioxide", "co2 emission"]}
- {terms: ["lulucf"], expands_to: ["land use, land use change and forestry"]}
- {terms: ["esr"], expands_to: ["effort sharing"]}
- {terms: ["red ii", "red iii"], expands_to: ["renewable energy directive", "promotion of the use of energy from renewable sources"]}
- {terms: ["epbd"], expands_to: ["energy performance of buildings"]}
- {terms: ["afir"], expands_to: ["alternative fuels infrastructure"]}
- {terms: ["eudr"], expands_to: ["deforestation regulation", "deforestation and forest degradation"]}
- {terms: ["nrl"], expands_to: ["nature restoration"]}
- {terms: ["ppwr"], expands_to: ["packaging and packaging waste"]}
- {terms: ["nzia"], expands_to: ["net-zero industry act", "net zero industry act"]}
- {terms: ["crma"], expands_to: ["critical raw materials act", "critical raw materials"]}
# Petrol and diesel cars are combustion-engine cars: the European Parliament's page on Regulation (EU) 2023/851
# is "EU ban on the sale of new petrol and diesel cars from 2035 explained" (a name of 2021/0197(COD) below), and
# the Commission (https://climate.ec.europa.eu/areas-action/transport-decarbonisation/road-transport/cars-and-vans_en)
# writes that Regulation (EU) 2023/851 "introduced a 100% emission reduction target for new passenger cars and vans
# from 2035 onwards", and that its proposed revision "will allow for plug-in hybrids (PHEVs), range extenders, mild
# hybrids, and internal combustion engine vehicles to still play a role beyond 2035"
- {terms: ["combustion engine", "combustion engines"], expands_to: ["new petrol and diesel cars"]}

