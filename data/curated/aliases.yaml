# General search synonyms: standard abbreviations and official short names used by the EU
# institutions themselves (EUR-Lex titles, Commission/EP/Council pages). No informal nicknames here;
# dossier-specific common names live in featured.yaml `aliases`, each with its own justification.
#
# Semantics: when a query token/phrase matches one of `terms` (case-insensitive, whole word/phrase),
# search also matches the phrases in `expands_to`. Expansion is one-directional and not recursive.

# ------------------------------------------------------------------ institutions & procedure
- {terms: ["eu"], expands_to: ["european union"]}
- {terms: ["ep", "europarl"], expands_to: ["european parliament"]}
- {terms: ["mep", "meps"], expands_to: ["member of the european parliament"]}
- {terms: ["cjeu"], expands_to: ["court of justice of the european union"]}
- {terms: ["ecb"], expands_to: ["european central bank"]}
- {terms: ["oj", "ojeu"], expands_to: ["official journal of the european union"]}
- {terms: ["olp", "codecision", "cod"], expands_to: ["ordinary legislative procedure"]}
- {terms: ["trilogue", "trilogues"], expands_to: ["interinstitutional negotiations", "provisional agreement"]}
- {terms: ["qmv"], expands_to: ["qualified majority"]}
- {terms: ["mff"], expands_to: ["multiannual financial framework"]}
- {terms: ["cwp"], expands_to: ["commission work programme"]}

# ------------------------------------------------------------------------ digital & data
- {terms: ["ai"], expands_to: ["artificial intelligence"]}
# "Artificial Intelligence Act" is the short title Regulation (EU) 2024/1689 gives itself in its OJ title;
# files whose official title cites that Regulation (e.g. the Digital Omnibus on AI, 2025/0359(COD)) amend it
- {terms: ["ai act"], expands_to: ["artificial intelligence act", "2024/1689"]}
- {terms: ["gdpr"], expands_to: ["general data protection regulation", "protection of natural persons with regard to the processing of personal data"]}
- {terms: ["dsa"], expands_to: ["digital services act", "single market for digital services"]}
- {terms: ["dma"], expands_to: ["digital markets act", "contestable and fair markets in the digital sector"]}
- {terms: ["cra"], expands_to: ["cyber resilience act", "horizontal cybersecurity requirements for products with digital elements"]}
- {terms: ["nis2", "nis 2"], expands_to: ["high common level of cybersecurity across the union"]}
- {terms: ["emfa"], expands_to: ["european media freedom act"]}
- {terms: ["ehds"], expands_to: ["european health data space"]}
- {terms: ["dora"], expands_to: ["digital operational resilience"]}
- {terms: ["mica"], expands_to: ["markets in crypto-assets"]}
- {terms: ["eprivacy", "e-privacy"], expands_to: ["privacy and electronic communications"]}
- {terms: ["csam"], expands_to: ["child sexual abuse material", "child sexual abuse"]}

# ------------------------------------------------------------------- climate, energy, nature
