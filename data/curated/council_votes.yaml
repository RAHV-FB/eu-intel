# Council votes: what the Treaties require where a Council voting-result document prints something else, and a
# Council adoption recorded only in another official Council document. Checked against the act's text, the
# Treaty and the Council's own documents; the snapshot keeps what the voting-result documents print.
#
# corrections: the voting sheet prints "Voting Rule: qualified majority" although the act's legal basis, cited in
#   the act itself, requires the Council to act unanimously. The build shows the rule as unanimity (TFEU Art.
#   238(4): abstentions do not prevent unanimity) and says on the vote what the sheet prints and why. It accepts
#   only a legal basis listed in UNANIMITY_BASES in pipeline/build.py, which quotes each Treaty provision.
#   The Council's sheets are not checked against legal bases automatically: neither the sheet nor our data
#   records the act's legal basis. These four were found by reading the legal basis (Cellar, and the act's
#   citations) of every act adopted by a Council vote recorded as qualified majority outside the ordinary
#   legislative procedure. Of those 24 votes (snapshot of 2026-10-22), 9 are on the annual budget, 1 (ST 9252/19)
#   adopts an ordinary-procedure act, these 4 need unanimity, and the other 10 rest on Articles 23, 122, 182,
#   228(4) and 349 TFEU or Article 2 of Protocol No 37, under which the Council acts by qualified majority.
#   Fields:
#     vote          the Council vote (ST id)
#     celex         the act adopted
#     legal_basis   key of UNANIMITY_BASES: the Treaty provision under which the act was adopted
#     citation      the act's citation of its legal basis, verbatim
#     outcome       optional: not_adopted, when under unanimity the vote did not adopt the act (a Member State
#                   voted against); outcome_note then says what the Council did instead, citing its documents
#     sources       [{label, url}] the texts checked, linked on the vote and on its timeline step
#                   (`correction_sources`); an entry without them is ignored
#     reviewed      date of the last check
#
# records: a Council adoption that no voting-result document records, as the Council's communication on the
#   outcome of a written procedure states it (each delegation's vote in words). Shown like a voting result, with
#   that document as its source. Fields as in data/snapshot/council/votes.json (CouncilVote), plus reviewed and
#   note (shown on the vote). A record is dated by the communication: the day the written procedure was completed.
#   Where the act gives another date, the note quotes both and does not reconcile them: CM 5860/22, point 2, records
#   the adoption of the Pillar Two Directive (2021/0433(CNS)) in the written procedure "completed on 15 December
#   2022 at 22:11", and the act is "Council Directive (EU) 2022/2523 of 14 December 2022" ("Done at Brussels, 14
#   December 2022"). These are the adoptions recorded so far, from the communications read (CM 5860/22, both items
#   that adopt an act of a file on this site); other written procedures may have been missed.
#
# Last full review: 2026-10-23.

corrections:
  - vote: "ST-15907-2022"  # 6 December 2022, ECOFIN: amendment of the 2021-2027 multiannual financial framework
    celex: "32022R2496"
    legal_basis: "TFEU Art. 312(2)"
    citation: "Having regard to the Treaty on the Functioning of the European Union, and in particular Article 312 thereof"
    outcome: not_adopted
    # ST 15179/22 (28 November 2022, the note for the adoption) and ST 15179/1/22 REV 1 (9 December), point 2:
    # "In accordance with Article 312(2) of the Treaty on the Functioning of the European Union, the Council may
    # adopt the Regulation acting unanimously and after obtaining the consent of the European Parliament." REV 1,
    # point 6, invites the Permanent Representatives Committee to "decide ... that, in view of urgency of the
    # matter, the Council uses the written procedure"; CM 5842/22: "Following the decision of the Permanent
    # Representatives Committee Part 2 on 12 December 2022 to use the written procedure".
    outcome_note: >-
      The voting-result document marks the result as adopted. Under unanimity, Hungary's vote against meant that
      the Regulation was not adopted at this meeting. The Council's General Secretariat had noted before the
      meeting, on 28 November 2022, that “In accordance with Article 312(2) of the Treaty on the Functioning of
      the European Union, the Council may adopt the Regulation acting unanimously and after obtaining the consent
      of the European Parliament” (ST 15179/22). On 9 December 2022 it invited the Permanent Representatives
      Committee to decide that the Council use the written procedure (ST 15179/1/22 REV 1), which the Committee
      decided on 12 December 2022 (CM 5842/22). The Council adopted the Regulation by written procedure completed
      on 15 December 2022, all Member States voting in favour except Hungary, which abstained (CM 5860/22):
      Council Regulation (EU, Euratom) 2022/2496 of 15 December 2022.
    sources:
      - {label: "Council Regulation (EU, Euratom) 2022/2496, citations", url: "https://eur-lex.europa.eu/eli/reg/2022/2496/oj"}
      - {label: "Council of the EU – ST 15179/22", url: "https://data.consilium.europa.eu/doc/document/ST-15179-2022-INIT/EN/pdf"}
      - {label: "Council of the EU – ST 15179/1/22 REV 1", url: "https://data.consilium.europa.eu/doc/document/ST-15179-2022-REV-1/EN/pdf"}
      - {label: "Council of the EU – CM 5842/22", url: "https://data.consilium.europa.eu/doc/document/CM-5842-2022-INIT/EN/pdf"}
      - {label: "Council of the EU – CM 5860/22", url: "https://data.consilium.europa.eu/doc/document/CM-5860-2022-INIT/EN/pdf"}
    reviewed: "2026-10-23"

