# -------------------------------------------------------------------------- Agriculture & Food

- id: "2023-0226"
  reference: "2023/0226(COD)"
  celex: ["32026R1388"]
  short_title: "New genomic techniques (NGT) plants"
  what: >-
    Sets rules for plants obtained by targeted mutagenesis and cisgenesis: plants comparable to
    conventionally bred plants ("category 1") are exempted from GMO authorisation requirements, while
    other NGT plants ("category 2") remain subject to GMO rules.
  why: >-
    Category 1 NGT food and feed will not carry GMO labels, but seeds and other plant reproductive
    material will be labelled; NGT plants may not be used in organic production, and developers must
    publish information on related patents.
  aliases: ["NGT", "new genomic techniques", "gene editing", "gene-edited crops", "new GMOs"]
  topics: ["agriculture", "health"]
  featured: false
  feature_order: null
  sources:
