# Curated editorial layer for major EU legislative dossiers.
#
# Rules (see docs/EDITORIAL.md):
# - `id` is the EP Open Data process id; `reference` the interinstitutional procedure reference.
#   Every id below was checked against https://data.europarl.europa.eu/api/v2/procedures/<id>.
# - `celex` lists the final act(s) adopted under the procedure, as linked in Cellar
#   (dossier -> act via cdm:work_part_of_dossier / cdm:resource_legal_adopts_resource_legal),
#   or [] when no act has been adopted. Status, dates and next steps are NOT stored here:
#   they are computed from the snapshot data.
# - `what` / `why` are plain, neutral descriptions of the legal content and its concrete effects,
#   written from the sources listed for each entry. Proposals are described as proposals.
# - `featured: true` marks the homepage selection (5-6 items); `feature_order` orders it.
#
# Last full review: 2026-10-22.

# ----------------------------------------------------------------------------- Technology & AI

- id: "2021-0106"
  reference: "2021/0106(COD)"
  celex: ["32024R1689"]
  short_title: "Artificial Intelligence Act"
  what: >-
    Sets EU-wide rules for artificial intelligence according to risk: it prohibits certain AI practices
    (such as social scoring), sets requirements for high-risk AI systems, imposes transparency duties on
    some AI systems such as chatbots and deepfakes, and sets obligations for providers of general-purpose
    AI models.
  why: >-
    Companies that develop or use AI in areas such as recruitment, credit scoring, education, law
    enforcement or critical infrastructure must meet requirements on risk management, data quality,
    documentation and human oversight; national authorities and the Commission's AI Office enforce the
    rules and can impose fines.
  aliases: ["AI Act", "EU AI Act", "Artificial Intelligence Act", "AI regulation"]
  topics: ["tech"]
  featured: true
  feature_order: 1
  sources:
    - {label: "Regulation (EU) 2024/1689 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}
    - {label: "European Commission – AI Act", url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"}
    - {label: "Legislative Observatory – 2021/0106(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2021/0106(COD)"}
  reviewed: "2026-10-22"

- id: "2025-0359"
  reference: "2025/0359(COD)"
  celex: ["32026R1744"]
  short_title: "Digital Omnibus on AI"
  what: >-
    Amends the AI Act to change how and when it applies: it replaces the original start date of the
    rules for high-risk AI systems with later fixed dates, adds a prohibition on AI practices that
    generate non-consensual intimate or sexual content or child sexual abuse material, and adjusts
    registration, documentation and supervision rules.
  why: >-
    Providers of high-risk AI systems get more time before the high-risk requirements apply, AI-enabled
    machinery is handled under the Machinery Regulation instead of directly under the AI Act's
    high-risk regime, and the Commission's AI Office receives stronger supervisory powers.
  aliases: ["AI omnibus", "Digital Omnibus on AI", "Omnibus VII"]
  topics: ["tech"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2026/1744 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"}
    - {label: "Legislative Train – Digital Omnibus on AI", url: "https://www.europarl.europa.eu/legislative-train/package-digital-package/file-digital-omnibus-on-ai"}
    - {label: "Council press release, 29 June 2026", url: "https://www.consilium.europa.eu/en/press/press-releases/2026/06/29/artificial-intelligence-council-gives-final-green-light-to-simplify-and-streamline-rules/"}
  reviewed: "2026-10-22"

- id: "2020-0361"
  reference: "2020/0361(COD)"
  celex: ["32022R2065"]
  short_title: "Digital Services Act"
  what: >-
    Sets obligations for online intermediaries and platforms on dealing with illegal content, on
    transparency of content moderation and online advertising, and on protecting users; very large online
    platforms and search engines must also assess and reduce systemic risks.
  why: >-
    Users can report illegal content and challenge moderation decisions; platforms may not show
    targeted advertising based on profiling to minors or using sensitive data; the Commission
    supervises the largest platforms and can fine them up to 6% of worldwide annual turnover.
  aliases: ["DSA", "Digital Services Act"]
  topics: ["tech", "rights"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2022/2065 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2022/2065/oj"}
    - {label: "Legislative Observatory – 2020/0361(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2020/0361(COD)"}
  reviewed: "2026-10-22"

- id: "2020-0374"
  reference: "2020/0374(COD)"
  celex: ["32022R1925"]
  short_title: "Digital Markets Act"
  what: >-
    Lets the Commission designate large digital platforms as "gatekeepers" and sets lists of practices
    they must follow or must not engage in, such as not ranking their own services more favourably and
    allowing users to uninstall pre-installed apps.
  why: >-
    Designated gatekeepers must give business users and consumers more choice, for example by allowing
    alternative app stores and offering choice screens; the Commission can fine non-compliance up to 10%
    of worldwide turnover, or 20% for repeated infringements.
  aliases: ["DMA", "Digital Markets Act", "gatekeeper regulation"]
  topics: ["tech", "economy"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2022/1925 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2022/1925/oj"}
    - {label: "Legislative Observatory – 2020/0374(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2020/0374(COD)"}
  reviewed: "2026-10-22"

- id: "2012-0011"
  reference: "2012/0011(COD)"
  celex: ["32016R0679"]
  short_title: "General Data Protection Regulation"
  what: >-
    Sets the EU rules for processing personal data: the legal grounds on which data may be processed,
    the rights of individuals, the obligations of organisations that handle data, and supervision by
    national data protection authorities.
  why: >-
    People can ask organisations to give access to, correct or delete their personal data and can
    complain to a data protection authority; organisations must have a legal basis for processing,
    report certain data breaches and can be fined up to EUR 20 million or 4% of worldwide annual
    turnover.
  aliases: ["GDPR", "General Data Protection Regulation", "data protection regulation"]
  topics: ["tech", "rights"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2016/679 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"}
    - {label: "Legislative Observatory – 2012/0011(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2012/0011(COD)"}
  reviewed: "2026-10-22"

- id: "2025-0360"
  reference: "2025/0360(COD)"
  celex: []
  short_title: "Digital Omnibus (data, privacy and cybersecurity rules)"
  what: >-
    Proposal would amend the GDPR, the ePrivacy Directive, the Data Act and the NIS2 and Critical
    Entities Resilience directives, and repeal several acts including the Data Governance Act and the
    Platform-to-Business Regulation, folding parts of them into the Data Act.
  why: >-
    If adopted, it would change obligations for organisations that process personal data, including
    how the definition of personal data is applied and how consent for cookies and similar device
    access is asked for (with rules moved from the ePrivacy Directive into the GDPR).
  aliases: ["Digital Omnibus", "digital simplification package", "GDPR reform"]
  topics: ["tech", "rights"]
  featured: false
  feature_order: null
  sources:
    - {label: "Commission proposal COM(2025) 837 (EUR-Lex)", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0837"}
    - {label: "European Commission – Digital Package FAQ", url: "https://digital-strategy.ec.europa.eu/en/faqs/digital-package"}
    - {label: "Legislative Observatory – 2025/0360(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0360(COD)"}
  reviewed: "2026-10-22"

- id: "2022-0277"
  reference: "2022/0277(COD)"
  celex: ["32024R1083"]
  short_title: "European Media Freedom Act"
  what: >-
    Sets common rules to protect the independence and pluralism of media: it restricts the use of
    spyware and other coercive measures against journalists and their sources, requires transparency of
    media ownership and of state advertising, and creates a European Board for Media Services.
  why: >-
    Media outlets must disclose who owns them; public service media must be independently governed and
    adequately funded; very large online platforms must follow a specific procedure before removing
    content from recognised media service providers.
  aliases: ["EMFA", "European Media Freedom Act", "media freedom act"]
  topics: ["rights", "tech"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2024/1083 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2024/1083/oj"}
    - {label: "Legislative Observatory – 2022/0277(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2022/0277(COD)"}
  reviewed: "2026-10-22"

# ------------------------------------------------------------------------- Migration & Borders

- id: "2020-0279"
  reference: "2020/0279(COD)"
  celex: ["32024R1351"]
  short_title: "Asylum and Migration Management Regulation"
  what: >-
    Replaces the Dublin III Regulation: it sets the criteria for deciding which Member State is
    responsible for examining an asylum application and creates a solidarity mechanism through which
    other Member States support those under migratory pressure.
  why: >-
    It determines in which country an asylum seeker's application is examined, and requires every
    Member State to contribute to an annual solidarity pool, choosing between relocating applicants,
    financial contributions or other support measures.
  aliases: ["AMMR", "Asylum and Migration Management Regulation", "Dublin reform", "Migration Pact"]
  topics: ["migration"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2024/1351 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2024/1351/oj"}
    - {label: "Legislative Observatory – 2020/0279(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2020/0279(COD)"}
  reviewed: "2026-10-22"

- id: "2016-0224"
  reference: "2016/0224(COD)"
  # Cellar links two acts to this procedure: the Asylum Procedure Regulation (2024/1348) and the
  # regulation establishing a return border procedure (2024/1349), which was split from it.
  celex: ["32024R1348", "32024R1349"]
  short_title: "Asylum Procedure Regulation"
  what: >-
    Replaces the Asylum Procedures Directive with a directly applicable regulation setting one common
    procedure for applying for and examining international protection, including a border procedure that
    is mandatory for certain categories of applicants and time limits for decisions.
  why: >-
    Applicants who come from countries with low asylum recognition rates, who are considered a security
    risk or who have misled the authorities can be examined in an accelerated border procedure; the same
    procedural guarantees and deadlines apply in all Member States.
  aliases: ["APR", "Asylum Procedure Regulation", "asylum procedures", "Migration Pact"]
  topics: ["migration"]
  featured: false
  feature_order: null
  sources:
