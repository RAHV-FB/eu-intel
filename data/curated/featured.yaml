  reference: "2021/0104(COD)"
  celex: ["32022L2464"]
  short_title: "Corporate Sustainability Reporting Directive"
  what: >-
    Requires companies in its scope to publish information on environmental, social and governance
    matters in their management report, following European Sustainability Reporting Standards and
    subject to external assurance.
  why: >-
    Investors and the public get comparable information on companies' sustainability risks and impacts;
    companies in scope must collect the data, report it and have it checked by an auditor.
  aliases: ["CSRD", "Corporate Sustainability Reporting Directive", "sustainability reporting", "ESG reporting"]
