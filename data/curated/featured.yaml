- id: "2023-0212"
  reference: "2023/0212(COD)"
  celex: []
  short_title: "Digital euro"
  what: >-
    Proposal would establish the digital euro as a digital form of central bank money issued by the
    European Central Bank, with legal tender status, alongside euro banknotes and coins.
  why: >-
    If adopted, people and businesses in the euro area could hold digital euros, subject to holding
    limits, and pay with them online and offline through banks and other payment service providers,
    with basic services free of charge for individuals; merchants that accept digital payments would
    generally have to accept it.
  aliases: ["digital euro", "e-euro", "central bank digital currency", "CBDC"]
  topics: ["economy"]
  featured: true
  feature_order: 6
  sources:
