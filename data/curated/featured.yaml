- id: "2023-0079"
  reference: "2023/0079(COD)"
  celex: ["32024R1252"]
  short_title: "Critical Raw Materials Act"
  what: >-
    Sets EU benchmarks for supplying strategic raw materials (10% of annual EU consumption extracted,
    40% processed and 25% recycled in the EU, and no more than 65% from a single non-EU country) and
    creates faster permitting and support for projects recognised as strategic.
  why: >-
    Mining, processing and recycling projects selected as strategic get shorter permitting deadlines and
    help with financing; large companies that manufacture strategic technologies must assess risks in
    their raw material supply chains.
  aliases: ["CRMA", "Critical Raw Materials Act", "critical minerals"]
  topics: ["economy", "environment"]
  featured: false
  feature_order: null
