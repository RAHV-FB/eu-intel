# ------------------------------------------------------------------------- Health & Consumers

- id: "2022-0140"
  reference: "2022/0140(COD)"
  celex: ["32025R0327"]
  short_title: "European Health Data Space"
  what: >-
    Creates a European Health Data Space: it gives people electronic access to their health data, such
    as patient summaries, prescriptions, medical images and lab results, across the EU, and sets rules
    for reusing health data for research, innovation and policy-making.
  why: >-
    Patients can access their electronic health records and share them with health professionals,
    including in other Member States; researchers and public bodies can request access to health data
    through national health data access bodies, and people can opt out of this secondary use.
  aliases: ["EHDS", "European Health Data Space", "health data"]
  topics: ["health", "tech"]
  featured: false
  feature_order: null
