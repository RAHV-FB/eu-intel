- id: "2025-0420"
  reference: "2025/0420(COD)"
  celex: []
  short_title: "CO2 standards for new cars and vans (2025 revision)"
  what: >-
    Proposal would amend the CO2 emission standards for new cars and vans: the 2035 target would become a
    90% reduction instead of 100%, with the remaining emissions to be compensated through credits for
    EU-made low-carbon steel or sustainable fuels; it would also replace the car labelling directive.
  why: >-
    If adopted, carmakers could continue to sell some plug-in hybrid, range-extender and combustion-engine
    vehicles after 2035, provided the remaining emissions are offset as set out in the regulation.
  aliases: ["2035 combustion engine ban", "car CO2 standards", "CO2 cars", "automotive package"]
  topics: ["transport", "environment"]
  featured: false
  feature_order: null
