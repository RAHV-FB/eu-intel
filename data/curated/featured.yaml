- id: "2024-0061"
  reference: "2024/0061(COD)"
  celex: ["32025R2643"]
  short_title: "European Defence Industry Programme"
  what: >-
    Establishes the European Defence Industry Programme, which provides EUR 1.5 billion in grants from the
    EU budget for 2025-2027 to strengthen Europe's defence industry, including a Ukraine Support
    Instrument, and sets measures to secure the supply of defence products.
  why: >-
    Defence companies in the EU, and for the Ukraine Support Instrument in Ukraine, can receive EU funding
    for joint procurement, production capacity and supply chains, provided components from outside the
    EU and associated countries do not exceed 35% of the cost of the end product.
  aliases: ["EDIP", "European Defence Industry Programme", "defence industry programme"]
  topics: ["security", "economy"]
  featured: false
