- id: "2025-0045"
  reference: "2025/0045(COD)"
  celex: ["32026L0470"]
  short_title: "Omnibus I – sustainability reporting and due diligence simplification"
  what: >-
    Amends the CSRD and the CSDDD to narrow their scope: sustainability reporting is required only from
    companies with more than 1,000 employees and over EUR 450 million net turnover, and due diligence only
    from companies with more than 5,000 employees and over EUR 1.5 billion net turnover.
  why: >-
    Most companies previously covered no longer have to report or carry out due diligence under these
    directives; companies with fewer than 1,000 employees do not have to give their larger business
    partners information beyond the voluntary reporting standard, and the obligation to adopt climate
    transition plans is removed.
  aliases: ["Omnibus I", "sustainability omnibus", "CSRD omnibus", "CSDDD omnibus", "simplification omnibus"]
  topics: ["economy", "environment"]
  featured: false
  feature_order: null
