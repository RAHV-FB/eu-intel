# ---------------------------------------------------------------- Employment & Social Policy

- id: "2021-0414"
  reference: "2021/0414(COD)"
  celex: ["32024L2831"]
  short_title: "Platform Work Directive"
  what: >-
    Introduces a legal presumption of employment for people working through digital labour platforms
    when facts indicate control and direction, and sets EU rules on algorithmic management of platform
    workers.
  why: >-
    People working through apps, such as ride-hailing or delivery platforms, can more easily have their
    employment status correctly determined; platforms must inform workers about automated monitoring
    and decision-making and ensure human review of significant decisions such as account suspensions.
  aliases: ["Platform Work Directive", "gig economy directive", "platform workers"]
  topics: ["social", "tech"]
  featured: false
  feature_order: null
  sources:
