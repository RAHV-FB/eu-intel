  reviewed: "2026-10-22"

- id: "2025-0329"
  reference: "2025/0329(COD)"
  celex: ["32025R2650"]
  short_title: "Deforestation Regulation – targeted revision and second postponement"
  what: >-
    Amends the Deforestation Regulation to postpone its application by a further year (with six more
    months for micro and small operators) and to simplify obligations: the due diligence statement is
    submitted by the operator that first places a product on the EU market, not by downstream operators
    and traders; certain printed products are removed from its scope.
  why: >-
    Fewer companies in a supply chain have to file their own due diligence statements, and all
    operators have more time before the obligations apply; the Commission must report on the
    regulation's impact and administrative burden.
  aliases: ["EUDR revision", "EUDR simplification", "EUDR delay"]
  topics: ["environment", "agriculture"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2025/2650 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2025/2650/oj"}
