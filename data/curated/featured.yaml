    - {label: "Legislative Observatory – 2016/0224(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2016/0224(COD)"}
  reviewed: "2026-10-22"

- id: "2025-0059"
  reference: "2025/0059(COD)"
  celex: ["32026R2280"]
  short_title: "Return Regulation"
  what: >-
    Replaces the 2008 Return Directive with a directly applicable regulation on returning non-EU
    nationals who have no right to stay in the EU: it introduces a European Return Order to help other
    Member States recognise return decisions and allows returns to "return hubs" in non-EU countries
    under agreements with those countries.
  why: >-
    People subject to a return decision face obligations to cooperate, with consequences for not doing
    so, and those considered a security risk can receive longer or indefinite entry bans; return hubs
    may only be set up with countries that respect international human rights standards and the
    principle of non-refoulement.
  aliases: ["Return Regulation", "returns regulation", "return hubs", "deportation rules", "European Return Order"]
  topics: ["migration"]
  featured: true
  feature_order: 2
  sources:
    - {label: "Regulation (EU) 2026/2280 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2026/2280/oj"}
    - {label: "Council press release, 1 October 2026", url: "https://www.consilium.europa.eu/en/press/press-releases/2026/10/01/council-adopts-new-rules-on-return-for-those-with-no-right-to-stay-in-the-eu/"}
    - {label: "Legislative Observatory – 2025/0059(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0059(COD)"}
  reviewed: "2026-10-22"

# ------------------------------------------------------------------------ Environment & Energy

- id: "2025-0524"
  reference: "2025/0524(COD)"
  celex: ["32026R0667"]
  short_title: "2040 climate target (European Climate Law amendment)"
  what: >-
    Amends the European Climate Law to add a binding EU target for 2040: a 90% reduction of net
    greenhouse gas emissions compared with 1990, of which up to 5 percentage points may be met with
    high-quality international carbon credits from 2036.
  why: >-
    The 2040 target frames future EU climate legislation for industry, energy, transport, buildings and
    agriculture; the same act postpones the start of the new emissions trading system for buildings and
    road transport (ETS2) by one year.
  aliases: ["2040 climate target", "2040 target", "Climate Law amendment", "90% target"]
  topics: ["environment"]
  featured: true
  feature_order: 5
  sources:
    - {label: "Regulation (EU) 2026/667 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2026/667/oj"}
    - {label: "Council press release, 5 March 2026", url: "https://www.consilium.europa.eu/en/press/press-releases/2026/03/05/2040-climate-target-council-gives-final-green-light/"}
    - {label: "Legislative Train – 2040 climate target", url: "https://www.europarl.europa.eu/legislative-train/theme-sustaining-our-quality-of-life-food-security-water-and-nature/file-2040-climate-target"}
  reviewed: "2026-10-22"

- id: "2022-0195"
  reference: "2022/0195(COD)"
  celex: ["32024R1991"]
  short_title: "Nature Restoration Regulation"
  what: >-
    Requires Member States to put in place restoration measures covering at least 20% of the EU's land
    and sea areas by 2030 and all ecosystems in need of restoration by 2050, set out in national
    restoration plans.
  why: >-
    Member States must take measures to restore habitats such as wetlands, rivers, forests, farmland and
    urban green spaces and to reverse the decline of pollinators; the obligations are on Member States,
    which choose the measures in their national plans.
  aliases: ["Nature Restoration Law", "NRL", "nature restoration"]
  topics: ["environment", "agriculture"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2024/1991 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2024/1991/oj"}
    - {label: "Legislative Observatory – 2022/0195(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2022/0195(COD)"}
  reviewed: "2026-10-22"

- id: "2021-0366"
  reference: "2021/0366(COD)"
  celex: ["32023R1115"]
  short_title: "EU Deforestation Regulation"
  what: >-
    Prohibits placing on the EU market, or exporting, cattle, cocoa, coffee, oil palm, rubber, soya and
    wood, and products made from them, unless they are deforestation-free, were produced legally and are
    covered by a due diligence statement.
  why: >-
    Companies placing these products on the EU market must collect the geolocation of the land where
    the commodities were produced and check that it was not deforested after 31 December 2020; the
    Commission classifies countries by risk level, which determines the share of operators that
    national authorities must check.
  aliases: ["EUDR", "Deforestation Regulation", "deforestation law", "deforestation-free products"]
  topics: ["environment", "agriculture", "economy"]
  featured: true
  feature_order: 4
  sources:
    - {label: "Regulation (EU) 2023/1115 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2023/1115/oj"}
    - {label: "Legislative Observatory – 2021/0366(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2021/0366(COD)"}
  reviewed: "2026-10-22"

- id: "2024-0249"
  reference: "2024/0249(COD)"
  celex: ["32024R3234"]
  short_title: "Deforestation Regulation – first postponement"
  what: >-
    Amends the Deforestation Regulation to postpone its application by 12 months, with a later date
    for micro and small enterprises.
  why: >-
    Companies, non-EU producing countries and national authorities were given an additional year to
    prepare for the due diligence and traceability obligations.
  aliases: ["EUDR delay", "EUDR postponement", "deforestation law delay"]
  topics: ["environment", "agriculture"]
