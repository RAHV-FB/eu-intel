- id: "2022-0196"
  reference: "2022/0196(COD)"
  celex: []
  short_title: "Sustainable Use of Plant Protection Products Regulation"
  what: >-
    Proposal would set legally binding EU and national targets to reduce the use and risk of chemical
    pesticides, restrict their use in sensitive areas and make integrated pest management mandatory for
    professional users.
  why: >-
    If adopted, farmers and other professional users would have to keep records, give priority to
    non-chemical methods and follow crop-specific rules, while Member States would have to meet
    reduction targets.
