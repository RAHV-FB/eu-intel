  reference: "2022/0051(COD)"
  celex: ["32024L1760"]
  short_title: "Corporate Sustainability Due Diligence Directive"
  what: >-
    Requires large companies to identify, prevent, mitigate and bring to an end adverse impacts on human
    rights and the environment in their own operations, their subsidiaries and their chains of
    activities.
  why: >-
    Companies in scope must carry out due diligence on their business partners and in their own
    operations, and national supervisory authorities can investigate and fine them for failures.
