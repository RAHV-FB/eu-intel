    - {label: "Council press release, 18 December 2025", url: "https://www.consilium.europa.eu/en/press/press-releases/2025/12/18/deforestation-council-signs-off-targeted-revision-to-simplify-and-postpone-the-regulation/"}
  reviewed: "2026-10-22"

- id: "2021-0214"
  reference: "2021/0214(COD)"
  celex: ["32023R0956"]
  short_title: "Carbon Border Adjustment Mechanism"
  what: >-
    Puts a carbon price on imports of cement, iron and steel, aluminium, fertilisers, electricity and
    hydrogen, corresponding to the carbon price paid by EU producers under the EU Emissions Trading
    System.
  why: >-
    Importers of these goods must report the greenhouse gas emissions embedded in them and buy CBAM
    certificates to cover those emissions, so that imported and EU-made goods face a comparable carbon
    cost.
  aliases: ["CBAM", "carbon border tax", "carbon border adjustment mechanism"]
  topics: ["environment", "economy"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2023/956 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2023/956/oj"}
    - {label: "Legislative Observatory – 2021/0214(COD)", url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2021/0214(COD)"}
  reviewed: "2026-10-22"

- id: "2022-0396"
  reference: "2022/0396(COD)"
  celex: ["32025R0040"]
  short_title: "Packaging and Packaging Waste Regulation"
  what: >-
    Replaces the Packaging Directive with a regulation that sets requirements for all packaging placed
    on the EU market, including recyclability, minimum recycled content for plastic packaging, limits on
    empty space, restrictions on certain single-use packaging formats and targets for reuse and for
    reducing packaging waste.
  why: >-
    Producers and retailers must adapt the packaging they use; Member States must cut packaging waste
    per person and set up deposit-return systems for single-use plastic bottles and metal drink cans,
    with some exemptions.
  aliases: ["PPWR", "Packaging Regulation", "packaging waste"]
  topics: ["environment", "health"]
  featured: false
  feature_order: null
  sources:
    - {label: "Regulation (EU) 2025/40 (EUR-Lex)", url: "https://eur-lex.europa.eu/eli/reg/2025/40/oj"}
