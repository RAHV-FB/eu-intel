# ----------------------------------------------------------------------------------- Transport

- id: "2018-0332"
  reference: "2018/0332(COD)"
  celex: []
  short_title: "Ending seasonal clock changes"
  what: >-
    Proposal would end the twice-yearly switch between summer time and standard time required by the
    Summer-Time Directive (2000/84/EC), which it would repeal; each Member State would choose whether
    to stay permanently on summer time or on standard time.
  why: >-
    If adopted, clocks in the EU would no longer change in March and October; Parliament's position
    adds a coordination mechanism so that Member States make their choice of time in a harmonised
    way.
  aliases: ["clock change", "daylight saving time", "summer time", "winter time", "time change"]
  topics: ["transport", "economy", "health"]
