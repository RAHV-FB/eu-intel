- id: "2022-0155"
  reference: "2022/0155(COD)"
  celex: []
  short_title: "Regulation to prevent and combat child sexual abuse online"
  what: >-
    Proposal would require providers of hosting and interpersonal communication services to assess and
    reduce the risk of their services being used for child sexual abuse, would allow authorities to
    issue orders to detect, report and remove such material, and would set up an EU Centre on Child
    Sexual Abuse.
  why: >-
    If adopted, messaging, email and hosting services could be required to scan for and report child
    sexual abuse material; whether and how detection orders apply, including to end-to-end encrypted
    services, is where the Parliament's and the Council's negotiating positions differ.
