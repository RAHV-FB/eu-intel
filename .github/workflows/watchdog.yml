# Data health: keeps one "Data health" issue (label data-health) open while anything below is wrong, updated with what
# is, and closes it once everything passes. It writes nothing to the repository.
#
# Checked on every run, from scratch:
# - sources that failed in their last run or are stale (`python -m pipeline health`: pipeline/freshness.py thresholds,
#   on main's data/snapshot/_manifest.json);
# - the latest Data refresh run that did run (a failed data gate, a failed push or deploy; not one its plan skipped), the
#   latest CI run for a push to main, the latest deploy after CI or by hand (failed, or cancelled with nothing after), and
#   the latest daily rebuild (rebuild.yml) that did not skip its deploy;
# - the live site's data/meta.json (SITE_URL repository variable, default the Pages URL below): its newest data older
#   than MAX_AGE_DAYS means no refresh has reached the site, whether the schedule was late, dropped or disabled, or
#   the refresh or its deploy failed. That alone also fails this run, so GitHub e-mails its notice too; and data on main
#   that the live site still lacks hours after it was retrieved (`pipeline health`, problem "undeployed");
# - the repository's size (every refresh commit adds to each clone).
#
# Runs after every Data refresh, every CI run for a push to main, every deploy and every daily rebuild (workflow_run:
# the results reach the issue without a step in those workflows that could fail them), daily at 19:41 UTC (after a Monday refresh even 8 h
# late), and by hand (Actions -> Watchdog -> Run workflow).
name: Watchdog

on:
  schedule:
    - cron: "41 19 * * *" # daily 19:41 UTC
  workflow_run:
    workflows: ["CI", "Data refresh", "Deploy to GitHub Pages", "Daily rebuild"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One update of the issue at a time; each run checks everything, so a run that waits can replace another.
concurrency:
  group: data-health
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DEFAULT_SITE_URL: https://rahv-fb.github.io/eu-intel/
  # weekly refresh + up to a day late; the core sources' own threshold is 9 days (pipeline/freshness.py)
  MAX_AGE_DAYS: "8"
  REPO_SIZE_WARN_MB: "750"
  LABEL: data-health
  LABEL_DESCRIPTION: "Opened and closed by the watchdog: failing or stale sources, failed refresh, red CI, stale site"
  TITLE: Data health

jobs:
  health:
    name: Check data health, update the issue
    # The canonical repository only (forks can run it by hand). After CI: runs for pushes and manual runs on main, not
    # pull requests (whose branch can be called main, in a fork). A cancelled run says nothing, except a deploy's: one
    # that nothing replaced means the site did not get what it should have.
    if: >-
      ${{ (github.repository == 'rahv-fb/eu-intel' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped' && (github.event.workflow_run.conclusion != 'cancelled' ||
      github.event.workflow_run.name == 'Deploy to GitHub Pages'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # open, update and close the issue
      actions: read # the latest Data refresh, CI and deploy runs
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # the pipeline's code, main's manifest and the run picker, nothing else
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipeline/
            /requirements.txt
            /data/snapshot/_manifest.json
            /scripts/latest_run.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Check
        id: check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          problems=()
          # what could not be read (an API error, a rate limit, a change in gh's output): a problem, never a pass
          unread=()
          # conclusion, id, url and sha of the latest completed run of a workflow on main that did its work: not
          # cancelled or skipped, and not one in which --job was skipped (a scheduled refresh its plan skipped, which
          # concludes "success" and would hide a failed one); see scripts/latest_run.py. All empty if there is none.
          latest() {
            local line
            conclusion="" id="" url="" sha=""
            if line=$(python scripts/latest_run.py "$@"); then
              read -r conclusion id url sha <<< "$line" || true
            else
              unread+=("the latest $1 run")
            fi
          }
          # the failed jobs of a run, each with its failed steps
          failed() {
            gh run view "$1" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name +
              ([.steps[]? | select(.conclusion == "failure") | .name] | if length > 0 then " (" + join(", ") + ")" else "" end)]
              | join("; ")' || echo "see the run"
          }

          latest refresh.yml --job "Fetch, validate, gate, commit"
          if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
            problems+=(--problem "refresh=**The latest Data refresh failed** ($conclusion, [run $id]($url)): $(failed "$id"). A refresh whose data fails the data gate commits and deploys nothing; the site keeps the last data that passed.")
          fi
          latest ci.yml --event push
          if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
            detail=$(failed "$id")
            hint=""
            # The known WebKit flake (docs/ASSESSMENT_2026-11.md 4.5): WebKit sometimes refuses the site's stylesheet under
            # its CSP ("Refused to apply a stylesheet because its hash ... does not appear in the style-src directive"),
            # e.g. in tests/e2e/smoke.spec.ts "typing "AI Act" on the homepage", which then passes on a second run.
            if [ "$detail" = "E2E + accessibility (Playwright, webkit) (Run Playwright)" ]; then
              hint=" Only WebKit's browser tests failed: if the log shows the known WebKit CSP flake (\"Refused to apply a stylesheet because its hash…\"), re-run the failed jobs once (*Re-run failed jobs*); fix anything else."
            fi
            problems+=(--problem "ci=**CI fails on main** ($conclusion, [run $id]($url), commit ${sha:0:7}): ${detail:-see the run}.${hint} Nothing is deployed after it, and a refresh deploys its data only once CI has passed on main's code: the refreshed data waits on main until then.")
          fi

          # the latest deploy after CI or by hand (a refresh's own deploy is part of its run, above): failed, or
          # cancelled with no later deploy that replaced it
          latest pages.yml --job "Build site" --cancelled-if-last
          if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
            detail=$(failed "$id")
            problems+=(--problem "deploy=**The latest deploy did not finish** ($conclusion, [run $id]($url), commit ${sha:0:7})${detail:+: $detail}. The site still serves the deployment before it: fix the cause and re-run it, or push a fix.")
          fi

          # the latest daily rebuild that deployed (or failed): one that skipped its deploy (CI not green, a refresh
          # running) did nothing
          latest rebuild.yml --job Deploy
          if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
            problems+=(--problem "rebuild=**The latest daily rebuild failed** ($conclusion, [run $id]($url)): $(failed "$id"). The site keeps its previous build, whose statuses and labels are as of the day it was built: fix the cause (e.g. a data gate that fails on today's date) and re-run it.")
          fi

          site=${SITE_URL:-$DEFAULT_SITE_URL}
          meta=(--max-age-days "$MAX_AGE_DAYS")
          if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 \
            -o "$RUNNER_TEMP/meta.json" "${site%/}/data/meta.json?watchdog=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; then
            meta+=(--meta "$RUNNER_TEMP/meta.json")
          else
            problems+=(--problem "site=**The live site's data/meta.json could not be fetched** (${site%/}/data/meta.json).")
          fi

          if ! kb=$(gh api "repos/$GITHUB_REPOSITORY" --jq .size); then
            unread+=("the repository's size")
          elif [ "$kb" -gt $(( REPO_SIZE_WARN_MB * 1024 )) ]; then
            problems+=(--problem "repo-size=**The repository is $(( kb / 1024 )) MB** (GitHub recommends under 1 GB; this warns from ${REPO_SIZE_WARN_MB} MB). Each data refresh commit adds to every clone.")
          fi
          if [ ${#unread[@]} -gt 0 ]; then
            what=$(printf '%s; ' "${unread[@]}")
            problems+=(--problem "watchdog=**The watchdog could not read** ${what%; } ([watchdog run]($RUN_URL)): GitHub's API failed, or its answer changed. A failure there is not listed here until it can be read; the issue stays open until then.")
          fi

          set +e
          python -m pipeline health "${meta[@]}" "${problems[@]}" --json > "$RUNNER_TEMP/health.json"
          rc=$?
          python -m pipeline health "${meta[@]}" "${problems[@]}" --markdown > "$RUNNER_TEMP/body.md"
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          # An exception exits 1, as "problems found" does: a check that wrote no report fails here (the last step says
          # so in the issue) instead of replacing the issue's list of problems with nothing.
          healthy=$(jq -r .healthy "$RUNNER_TEMP/health.json")
          if [[ "$healthy" != true && "$healthy" != false ]] || [[ "$(head -n 1 "$RUNNER_TEMP/body.md")" != "<!-- data-health: "* ]]; then
            echo "::error::python -m pipeline health exited $rc without a report"
            exit 1
          fi
          echo "Opened, updated and closed by the [watchdog]($RUN_URL) (.github/workflows/watchdog.yml) after each Data refresh, CI run on main, deploy and daily rebuild, and daily; it closes once every check passes. docs/DEPLOYMENT.md, \"Data health\", says what each check means." >> "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "healthy=$healthy"
            echo "site_ok=$(jq -r '[.problems[].key] | index("site") == null' "$RUNNER_TEMP/health.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        env:
          HEALTHY: ${{ steps.check.outputs.healthy }}
        run: |
          gh label create "$LABEL" --force --color D93F0B --description "$LABEL_DESCRIPTION"
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$HEALTHY" = true ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "All checks pass as of $(date -u '+%Y-%m-%d %H:%M UTC') ([watchdog run]($RUN_URL)). Closing."
              gh issue close "$number" --reason completed
            fi
            exit 0
          fi
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi
          # a comment (which notifies, unlike an edit) for each problem the issue did not list yet
          old=$(gh issue view "$number" --json body --jq .body | tr -d '\r' | sed -n 's/^<!-- data-health: \(.*\) -->$/\1/p')
          new=$(jq -r --arg old ",$old," '.problems[] | .key as $k | select($old | contains("," + $k + ",") | not) |
            "- " + .text' "$RUNNER_TEMP/health.json")
          gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
          if [ -n "$new" ]; then
            gh issue comment "$number" --body "$(printf 'New since the last check ([watchdog run](%s)):\n\n%s' "$RUN_URL" "$new")"
          fi

      - name: Fail if the live site's data is overdue
        if: ${{ steps.check.outputs.site_ok == 'false' }}
        run: |
          echo "::error::The live site's data is overdue or unreadable: see the Data health issue."
          exit 1

      # Nothing else reports here: when the watchdog cannot finish its own check (an exception, a failed install), the
      # issue says so, once per spell of failures, instead of going on listing what its last complete run found.
      - name: Report the watchdog's own failure
        if: ${{ failure() && steps.check.outcome != 'success' }}
        run: |
          text="**The watchdog itself failed** ([watchdog run]($RUN_URL)): it could not check the data's health, so this issue lists what its last complete run found, nothing newer, until a run completes. See the run's log, fix the cause and run it again (*Actions → Watchdog → Run workflow*)."
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create "$LABEL" --force --color D93F0B --description "$LABEL_DESCRIPTION"
            gh issue create --title "$TITLE" --label "$LABEL" --body "$text"
            exit 0
          fi
          last=$(gh issue view "$number" --json comments --jq '.comments[-1].body // ""')
          if [[ "$last" != "**The watchdog itself failed**"* ]]; then
            gh issue comment "$number" --body "$text"
          fi
