# Weekly data refresh: fetch official sources -> validate per source -> data gate -> commit the snapshot to main ->
# deploy that commit.
#
# - Schedule: Mondays 05:17 UTC, and Mondays 22:37 UTC as a second try. GitHub starts scheduled runs late or drops
#   them under load (the Monday cron has started up to 8 h late), so a scheduled run is skipped when every core source
#   (pipeline/freshness.py CORE_SOURCES) was retrieved less than RECENT_HOURS ago, by main's _manifest.json: a run
#   whose core sources failed is retried, and a commit of other data (a partial manual refresh, a restore) does not
#   count. A scheduled run in the first seven days of a month is a full refresh
#   (EU_INTEL_FULL_REFRESH=1, decided in the plan job: cron would OR a day-of-month with the weekday). GitHub disables
#   schedules in public repos after 60 days without activity (a commit): this run's weekly commits keep the repository
#   active. The watchdog's own daily run is disabled with it; it then reports overdue data after the next push to main.
# - Each source is failure-isolated by `python -m pipeline fetch`: a failed source keeps its previous
#   snapshot files and is recorded in data/snapshot/_manifest.json; the job carries on. A failed source alone does not
#   fail the run (the Legislative Train fails on every runner): it goes into the "Data health" issue (watchdog.yml).
# - Time limits: the fetch gets a run-wide deadline (EU_INTEL_FETCH_DEADLINE, FETCH_DEADLINE_MIN after it
#   starts). After it no source is started, sources start no new work and requests get no retries or long
#   waits (pipeline/http.py). `timeout --signal=INT` stops the fetch at FETCH_LIMIT_MIN at the latest, well
#   before the job timeout, so the checkpoints already written still go through the gate and are committed if they
#   pass.
# - Validation is per source: a source whose new files fail structural validation gets its files and its
#   manifest entry back from the last commit; the other sources' new data is kept.
# - The data gate, before anything reaches main: snapshot validation, the strict data build that records the activity
#   log (EU_INTEL_STRICT=1, EU_INTEL_RECORD_ACTIVITY=1), validation of the built data, its dated wording
#   (src/lib/format.test.ts), the site build, the privacy check and the size limit: the checks CI runs on the current
#   data and the deploy runs again. If any fails, nothing is committed (neither data/snapshot nor data/state), the run
#   fails and the site keeps the last data that passed; the next run fetches again.
# - The push survives concurrent commits on main: this run's data changes are re-applied on top of the
#   current main (for the data files this run changed, its version wins; _manifest.json is merged per
#   source). Do not commit data/snapshot or data/state by hand while a refresh is running.
# - Deploy: the commit pushed, through pages.yml (workflow_call; GITHUB_TOKEN pushes trigger no workflow), once CI has
#   passed on its code. If CI has not (yet), e.g. after a code push during the refresh, the deploy that follows CI's
#   next success on main publishes this data (pages.yml builds main when only data commits followed the tested one).
#   CI does not run on the refresh commit: its tests use the frozen test data, and this run gated the new data.
# - Scheduled runs other than the monthly full refresh are incremental: EP procedures, EP votes and the Legislative
#   Train re-read new, open or recently changed records, plus this week's share of the others (a rotation: each record
#   at least every 8 weeks), and reuse the rest; a change of a source's PARSER_VERSION re-reads all of its records
#   (docs/DEPLOYMENT.md, "What a weekly run re-reads").
# Manual run: Actions -> Data refresh -> Run workflow (optionally list specific sources; "Full refresh" re-reads
# every stored record of those three sources). A manual run is never skipped.
name: Data refresh

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
    - cron: "37 22 * * 1" # Mondays 22:37 UTC: skipped if the core sources were all retrieved in the last 20 h
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to fetch, space-separated (blank = all): ep_people ep_procedures ep_votes eurlex council implementation optouts train"
        required: false
        default: ""
      full_refresh:
        description: "Full refresh: re-read every stored record of ep_procedures, ep_votes and train, not only new and changing ones (best with those sources listed above; resumes over several runs)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One refresh at a time (the second cron's run waits for a late first one, then skips); never cancel one mid-run.
concurrency:
  group: refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  EU_INTEL_NO_CACHE: "1"
  # Per-source time budget (seconds). Sources fetch in chunks, upsert each finished chunk into the committed
  # snapshot and record pending work in data/snapshot/<source>/_state.json, so a long backfill that exceeds the
  # budget stops cleanly, is committed, and continues on the next run.
  EU_INTEL_FETCH_BUDGET_S: "1500"
  # Whole fetch: soft deadline (no new work, no retries) and hard stop, in minutes from the start of the fetch.
  # Job budget: setup ~5 + fetch <= FETCH_LIMIT_MIN + 3 (kill grace) + validate, data gate and commit ~10 < 120.
  FETCH_DEADLINE_MIN: "80"
  FETCH_LIMIT_MIN: "90"
  # A scheduled run is skipped when every core source on main was retrieved less than this many hours ago.
  RECENT_HOURS: "20"

jobs:
  plan:
    name: Plan
    # Scheduled runs only in the canonical repository (forks can still dispatch manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'rahv-fb/eu-intel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Skip after a recent refresh; full refresh in the first week of a month
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full_refresh }}
          # pipeline/freshness.py CORE_SOURCES (tests/test_workflows.py checks they agree)
          CORE_SOURCES: ep_procedures ep_votes eurlex council
        run: |
          full=""
          if [ "$EVENT" = schedule ]; then
            # main's manifest, read through the API (this job has no checkout); unreadable, the run goes ahead
            manifest=$(gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/data/snapshot/_manifest.json?ref=main") || manifest=""
            # the oldest last successful retrieval of the core sources, in hours ("none" if one has none)
            oldest=$(MANIFEST="$manifest" python3 - <<'PY'
          import json, os
          from datetime import UTC, datetime

          try:
              m = json.loads(os.environ["MANIFEST"])
          except ValueError:
              m = {}
          ages = []
          for s in os.environ["CORE_SOURCES"].split():
              at = (m.get(s) or {}).get("fetched_at") if isinstance(m, dict) else None
              try:
                  ages.append((datetime.now(UTC) - datetime.fromisoformat(at.replace("Z", "+00:00"))).total_seconds() / 3600)
              except (AttributeError, TypeError, ValueError):
                  ages.append(None)
          print("none" if not ages or None in ages else f"{max(ages):.1f}")
          PY
            )
            if [ "$oldest" != none ] && awk -v a="$oldest" -v h="$RECENT_HOURS" 'BEGIN { exit !(a < h) }'; then
              echo "Every core source ($CORE_SOURCES) was retrieved in the last ${oldest} h, less than ${RECENT_HOURS} h ago (main's data/snapshot/_manifest.json): this scheduled run is skipped." |
                tee -a "$GITHUB_STEP_SUMMARY"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "The oldest retrieval of a core source on main is ${oldest} h old: this scheduled run goes ahead." | tee -a "$GITHUB_STEP_SUMMARY"
            # cron ORs a day-of-month field with the weekday, so "the first Monday of the month" is decided here
            if [ "$(date -u +%-d)" -le 7 ]; then
              full=1
              echo "First week of the month: full refresh." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$FULL_INPUT" = true ]; then
            full=1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  refresh:
    name: Fetch, validate, gate, commit
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # push the refresh commit to main
      actions: read # find the CI runs that passed on main's code
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      deploy: ${{ steps.tested.outputs.deploy }}
    steps:
      # main with every commit and tree of its history but only the current files (filter: blob:none): the push's
      # re-apply and the check that CI passed on the pushed code compare commits and trees. No credentials are kept in
      # .git/config: this job runs npm packages (npm ci, vitest, the site build), and only the push step gets the token.
      # Other fetches (git's lazy fetch of a file's contents) need none: the repository is public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # poppler-utils (pdftoppm) renders Council voting-result sheets for the council source. The Python packages are
        # the pinned, hash-checked runtime dependencies (requirements.txt): this job can push to main, and an unattended
        # run must not install a release CI has not tested. The pipeline runs from the checkout (python -m pipeline).
        # The Node packages are those of package-lock.json, for the data gate's dated-wording check and site build.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --require-hashes -r requirements.txt
          npm ci

      - name: Fetch official sources
        id: fetch
        # Backstop only: the fetch stops itself at FETCH_LIMIT_MIN (+3 min grace).
        timeout-minutes: 100
        env:
          SOURCES: ${{ inputs.sources }}
          # "1" on a manual run with "Full refresh" ticked and on scheduled runs in the first week of a month
          EU_INTEL_FULL_REFRESH: ${{ needs.plan.outputs.full }}
        run: |
          if [[ ! "$SOURCES" =~ ^[a-z_\ ]*$ ]]; then
            echo "rc=2" >> "$GITHUB_OUTPUT"
            echo "::error::invalid sources input"; exit 2
          fi
          EU_INTEL_FETCH_DEADLINE=$(( $(date +%s) + FETCH_DEADLINE_MIN * 60 ))
          export EU_INTEL_FETCH_DEADLINE
          set +e
          # SIGINT lets the pipeline record the interrupted source and abort its requests; KILL 3 min later.
          # shellcheck disable=SC2086  # word splitting of the source list is intended
          timeout --signal=INT --kill-after=3m "${FETCH_LIMIT_MIN}m" python -m pipeline fetch $SOURCES
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            2) echo "::error::unknown source name"; exit 2 ;;
            124 | 130 | 137)
              echo "::warning::The fetch was stopped at its time limit (${FETCH_LIMIT_MIN} min); the checkpoints written so far are kept and the rest resumes next run." ;;
            *)
              echo "::warning::One or more sources failed or were not refreshed; their previous snapshot files were kept (see data/snapshot/_manifest.json)." ;;
          esac

      - name: Validate snapshot per source (restore failing sources)
        id: validate
        if: ${{ !cancelled() && steps.fetch.outputs.rc != '2' }}
        run: |
          # Sources with structural errors (one per line; the report goes to the log).
          failing=$(python -m pipeline validate --list-failing)
          if [ -n "$failing" ]; then
            head_manifest="$RUNNER_TEMP/manifest_head.json"
            git show HEAD:data/snapshot/_manifest.json > "$head_manifest" 2>/dev/null || echo '{}' > "$head_manifest"
            restored=""
            for s in $failing; do
              if [[ ! "$s" =~ ^[a-z_]+$ ]]; then
                echo "::error::unexpected source name from validation: $s"; exit 1
              fi
              if [ "$s" = "_manifest" ]; then
                echo "::error::data/snapshot/_manifest.json is unreadable; restoring it from the last commit."
                git checkout HEAD -- data/snapshot/_manifest.json
                continue
              fi
              echo "::error::$s: this run's data failed validation; its previous files are restored from the last commit."
              rm -rf "data/snapshot/$s"
              git checkout HEAD -- "data/snapshot/$s" 2>/dev/null || echo "($s was not in the last commit: removed)"
              restored="$restored $s"
            done
            if [ -n "$restored" ]; then
              # shellcheck disable=SC2086  # word splitting of the source list is intended
              python -m pipeline restore-manifest --previous "$head_manifest" $restored
            fi
          fi
          # Everything that is committed must pass.
          python -m pipeline validate

      - name: Source status
        if: ${{ always() && steps.fetch.outcome != 'skipped' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/snapshot/_manifest.json")
          try:
              m = json.loads(p.read_text()) if p.exists() else {}
          except ValueError:
              m = {}
          print("| source | status | last successful fetch | records | note |")
          print("| --- | --- | --- | --- | --- |")
          for k, v in sorted(m.items()):
              recs = ", ".join(f"{a}: {b}" for a, b in (v.get("records") or {}).items())
              note = (v.get("note") or "").replace("|", "/")[:160]
              print(f"| {k} | {v.get('status')} | {v.get('fetched_at') or '-'} | {recs} | {note} |")
          PY

      # ---------------------------------------------------------------- the data gate (nothing is committed before it)
      # TODO(quarantine, docs/ASSESSMENT_2026-11.md 1.5): when the gate fails, revert each source this run changed to
      # HEAD in turn (its files, its manifest entry marked partial with a note, data/state back to HEAD), re-run the gate
      # and commit the largest set of sources that passes, instead of nothing. Not done yet: sources read each other's
      # files (ep_votes reads ep_procedures), the activity log must be rebuilt for each attempt, and up to eight more
      # gate runs (~4 min each) do not fit the job's time limit after a long fetch.
      - name: Build and record activity (strict)
        id: build
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        env:
          EU_INTEL_RECORD_ACTIVITY: "1"
          EU_INTEL_STRICT: "1"
        run: python -m pipeline build

      - name: Validate built data
        id: validate_built
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m pipeline validate --built

      - name: Check the dated wording of the built data
        id: wording
        if: ${{ !cancelled() && steps.validate_built.outcome == 'success' }}
        run: npx vitest run src/lib/format.test.ts

      - name: Build site
        id: site
        if: ${{ !cancelled() && steps.wording.outcome == 'success' }}
        env:
          BASE_PATH: /eu-intel/
        run: npm run build

      - name: Privacy check
        id: privacy
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: node scripts/check_privacy.mjs

      - name: Check Pages size limit
        id: size
        if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
        run: |
          du -sh dist
          kb=$(du -sk dist | cut -f1)
          # GitHub Pages sites may be at most 1 GB; fail well before that (as pages.yml does).
          if [ "$kb" -gt 900000 ]; then echo "::error::dist is ${kb} KB (Pages limit is 1 GB)"; exit 1; fi
          if [ "$kb" -gt 500000 ]; then echo "::warning::dist is ${kb} KB; Pages limit is 1 GB"; fi

      - name: Report a failed data gate
        if: ${{ failure() && steps.validate.outcome == 'success' && steps.size.outcome != 'success' }}
        run: |
          echo "::error::The refreshed data failed the data gate: nothing was committed or deployed; the site keeps the last data that passed."
          echo "**The refreshed data failed the data gate**: nothing was committed or deployed." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- commit, push
      - name: Commit and push snapshot
        id: push
        if: ${{ !cancelled() && steps.size.outcome == 'success' }}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # The token for the push and the re-apply's fetch only, in the header actions/checkout would have stored
          # (persist-credentials: false above); git passes -c settings on to the lazy fetches it starts itself.
          basic=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          authgit() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" "$@"; }
          paths=(data/snapshot)
          [ -d data/state ] && paths+=(data/state)
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No data changes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tail -n 30
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject="Data refresh $(date -u +%Y-%m-%d)"
          body="Automated by .github/workflows/refresh.yml (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          git commit -q -m "$subject" -m "$body"

          # Re-create the commit on top of the current main after a rejected push: everything comes from main
          # except the data files this run changed, for which this run's version wins; _manifest.json is
          # merged per source (entries this run did not change keep main's version).
          # Returns 3 if main already has this data.
          reapply() {
            local ours base f
            ours=$(git rev-parse HEAD) || return 1
            base=$(git rev-parse HEAD~1) || return 1
            authgit fetch -q origin main || return 1
            authgit reset -q --hard FETCH_HEAD || return 1
            mapfile -d '' -t changed < <(git diff --name-only --no-renames -z "$base" "$ours" -- data/snapshot data/state)
            for f in "${changed[@]}"; do
              if git cat-file -e "$ours:$f" 2>/dev/null; then
                git checkout -q "$ours" -- "$f" || return 1
              else
                git rm -q --ignore-unmatch -- "$f" || return 1
              fi
            done
            python - "$base" "$ours" <<'PY' || return 1
          import json, subprocess, sys

          PATH = "data/snapshot/_manifest.json"

          def load(rev):
              r = subprocess.run(["git", "show", f"{rev}:{PATH}"], capture_output=True, text=True)
              try:
                  d = json.loads(r.stdout) if r.returncode == 0 else {}
              except ValueError:
                  d = {}
              return d if isinstance(d, dict) else {}

          base, ours, theirs = load(sys.argv[1]), load(sys.argv[2]), load("HEAD")
          if ours:
              merged = dict(theirs)
              for k in set(base) | set(ours):
                  if ours.get(k) != base.get(k):  # this run changed the entry: it wins
                      if k in ours:
                          merged[k] = ours[k]
                      else:
                          merged.pop(k, None)
              with open(PATH, "w", encoding="utf-8") as f:
                  f.write(json.dumps(dict(sorted(merged.items())), indent=1, sort_keys=True) + "\n")
          PY
            git add -A -- "${paths[@]}" || return 1
            if git diff --cached --quiet; then return 3; fi
            git commit -q -m "$subject" -m "$body" || return 1
          }

          for attempt in 1 2 3 4 5; do
            if authgit push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "Push rejected (main moved?); re-applying this run's data on top of main (attempt $attempt)."
            sleep $((attempt * 5))
            rc=0
            reapply || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "Main already contains this run's data; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::could not re-apply the data refresh on top of main"
              exit 1
            fi
          done
          echo "::error::could not push the data refresh commit"
          exit 1

      - name: Deploy only code that CI has passed
        id: tested
        if: ${{ steps.push.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        # The data passed the gate above; its code must have passed CI (tests on the frozen data, e2e): a successful CI
        # run for a push to main on a commit with the same files outside data/snapshot and data/state.
        run: scripts/ci-passed.sh "$SHA"

  deploy:
    name: Deploy
    needs: refresh
    if: ${{ needs.refresh.outputs.deploy == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
