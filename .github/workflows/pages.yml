# Build and deploy the static site to GitHub Pages.
#
# Triggers (workflow_run): a successful "CI" run for a push to main, so that code is deployed only once its tests
# have passed, and a successful "Data refresh" run (commits pushed with GITHUB_TOKEN do not trigger `push`
# workflows, so the refresh hands over this way); and manual dispatch.
# Any failure in the build job (validation of the snapshot or of the built data, data build, the dated-wording check,
# site build, privacy check, size check) stops the run before deploy; the previous deployment stays live.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (docs/DEPLOYMENT.md).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Data refresh"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build site
    # CI also runs on pull requests and manual runs: only a successful run for a push to main deploys
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Data refresh' || github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # On workflow_run this checks out the latest commit on main, i.e. including the refresh commit; after CI, the
      # next step goes back to the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event.workflow_run.name == 'CI' && 50 || 1 }}

      - name: Build the commit CI tested
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' }}
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # If main has moved on since only by data refresh commits (data/snapshot, data/state), build main: its code is
          # the code CI tested, and this deploy does not take the refreshed data off the site. Otherwise build the commit
          # CI tested (a newer code commit is deployed by its own CI run).
          if git merge-base --is-ancestor "$CI_SHA" HEAD &&
            git diff --quiet "$CI_SHA" HEAD -- . ':(exclude)data/snapshot' ':(exclude)data/state'; then
            echo "Building $(git rev-parse HEAD): CI passed on $CI_SHA; later commits change only data/snapshot and data/state."
          else
            git checkout --quiet --detach "$CI_SHA"
            echo "Building $CI_SHA, the commit CI passed."
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm ci

      - name: Validate snapshot
        run: python -m pipeline validate

      - name: Build site data (public/data)
        env:
          # Absolute links in the Atom feeds: the Pages URL, so a custom domain is used once it is set.
          # (The feed and entry ids do not depend on it: pipeline/analysis/feeds.py TAG_BASE.)
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python -m pipeline build

      - name: Validate built data
        # The built-output checks of pipeline/validate.py; --built fails if public/data is missing.
        run: python -m pipeline validate --built

      - name: Check the dated wording of the built data
        # The checks of src/lib/format.test.ts on this build: every date a next step, status explanation or timeline
        # step states as still ahead is restated correctly once it has passed, and no dated wording is unknown to
        # src/lib/format.ts. They do not depend on the committed snapshot, unlike the other data tests (run by CI).
        run: npx vitest run src/lib/format.test.ts

      - name: Build site
        env:
          # "/eu-intel" for a project site, "" for a custom domain -> "/eu-intel/" or "/".
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Canonical address of each page (scripts/prerender-routes.mjs): the Pages URL, as for the Atom feeds above.
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          echo "BASE_PATH=$BASE_PATH"
          npm run build

      - name: Privacy check
        run: node scripts/check_privacy.mjs

      - name: Check Pages size limit
        run: |
          du -sh dist
          kb=$(du -sk dist | cut -f1)
          # GitHub Pages sites may be at most 1 GB; fail well before that.
          if [ "$kb" -gt 900000 ]; then echo "::error::dist is ${kb} KB (Pages limit is 1 GB)"; exit 1; fi
          if [ "$kb" -gt 500000 ]; then echo "::warning::dist is ${kb} KB; Pages limit is 1 GB"; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
