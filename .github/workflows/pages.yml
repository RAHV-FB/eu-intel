# Build and deploy the static site to GitHub Pages.
#
# Three ways in, each deploying one known commit:
# - workflow_run: a successful "CI" run for a push to main deploys the commit CI tested (code reaches the site only once
#   its tests have passed);
# - workflow_call: a "Data refresh" run deploys the commit it pushed (`ref`), once that commit's data has passed the
#   refresh's data gate and its code has passed CI (refresh.yml). The caller grants pages: write and id-token: write;
# - workflow_dispatch: a manual run builds the branch it is started on, without waiting for CI.
# After CI, if main (as of the run's event) had moved on since that commit only by data refresh commits (data/snapshot,
# data/state), main is built instead: same code, newer data, so that a deploy never takes refreshed data off the site.
# The build job runs the data gate again on what it deploys (snapshot validation, the strict data build, validation of
# the built data, the dated-wording check, site build, privacy check, size check), then opens the built site in Chromium
# on its own data (tests/e2e/live-smoke.spec.ts); any failure stops the run before deploy, and the previous deployment
# stays live.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (docs/DEPLOYMENT.md).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to deploy (a data refresh commit that passed the data gate)
        type: string
        required: true

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build site
    # CI also runs on pull requests and manual runs: only a successful run for a push to main deploys. In a run called by
    # the refresh, github.event_name is the refresh's own event (schedule or workflow_dispatch): inputs.ref tells it apart.
    if: >-
      ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    # Ubuntu 24.04: the release whose runner image is known to have the libraries Chromium needs for the smoke test
    # below (CI's `playwright install --with-deps chromium` there added only fonts, 5 Nov 2026), so no apt step.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      built_at: ${{ steps.record.outputs.built_at }}
    steps:
      # The commit to deploy, with every commit and tree of the history but no file contents beyond this commit's
      # (filter: blob:none, about 0.1 MB for the whole history): the next step only compares commits and trees.
      # fetch-depth: 50 fetched the files of the last 50 commits instead, about 12 MB per data refresh among them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0
          filter: blob:none

      - name: Build the newest data on the tested code
        id: commit
        if: ${{ inputs.ref != '' || github.event_name == 'workflow_run' }}
        env:
          # main when this run's event happened (after CI: when CI finished; called by a refresh: when the refresh
          # started, before its push). A re-run keeps it, so it builds what the first run built (docs/DEPLOYMENT.md,
          # "Rolling back a bad data refresh", step 5).
          MAIN_SHA: ${{ github.sha }}
        run: |
          # If main had moved on since this commit only by data refresh commits (data/snapshot, data/state), build that
          # main: its code is the code tested here, and this deploy must not take the newer data off the site. Otherwise
          # build this commit (a newer code commit is deployed after CI passes on it). Checking out main fetches its
          # files without credentials, which a public repository allows.
          main=$MAIN_SHA
          if [ "$main" != "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor HEAD "$main" &&
            git diff --quiet --no-renames HEAD "$main" -- . ':(exclude)data/snapshot' ':(exclude)data/state'; then
            echo "Building main ($main): the commits after $(git rev-parse HEAD) change only data/snapshot and data/state."
            git checkout --quiet --detach "$main"
          else
            echo "Building $(git rev-parse HEAD)."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # the pinned, hash-checked runtime dependencies (requirements.txt); the pipeline runs from the checkout
        run: |
          python -m pip install --require-hashes -r requirements.txt
          npm ci

      - name: Validate snapshot
        run: python -m pipeline validate

      - name: Build site data (public/data, strict)
        env:
          EU_INTEL_STRICT: "1"
          # Absolute links in the Atom feeds: the Pages URL, so a custom domain is used once it is set.
          # (The feed and entry ids do not depend on it: pipeline/analysis/feeds.py TAG_BASE.)
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python -m pipeline build

      - name: Validate built data
        # The built-output checks of pipeline/validate.py; --built fails if public/data is missing.
        run: python -m pipeline validate --built

      - name: Check the dated wording of the built data
        # The checks of src/lib/format.test.ts on this build: every date a next step, status explanation or timeline
        # step states as still ahead is restated correctly once it has passed, and no dated wording is unknown to
        # src/lib/format.ts. The other data tests run in CI on the frozen test data (tests/frozen-data.txt).
        run: npx vitest run src/lib/format.test.ts

      - name: Build site
        env:
          # "/eu-intel" for a project site, "" for a custom domain -> "/eu-intel/" or "/".
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Canonical address of each page (scripts/prerender-routes.mjs): the Pages URL, as for the Atom feeds above.
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          echo "BASE_PATH=$BASE_PATH"
          npm run build

      - name: Privacy check
        run: node scripts/check_privacy.mjs

      - name: Check Pages size limit
        run: |
          du -sh dist
          kb=$(du -sk dist | cut -f1)
          # GitHub Pages sites may be at most 1 GB; fail well before that.
          if [ "$kb" -gt 900000 ]; then echo "::error::dist is ${kb} KB (Pages limit is 1 GB)"; exit 1; fi
          if [ "$kb" -gt 500000 ]; then echo "::warning::dist is ${kb} KB; Pages limit is 1 GB"; fi

      # The browser tests in CI run on the frozen test data; this opens the site about to be published, on its own data,
      # before anything is uploaded: tests/e2e/live-smoke.spec.ts picks the pages from dist/data (files of every stage,
      # votes of every kind, MEPs, groups, parties, every country, search, the main pages), with the reader's clock, and
      # fails on a console error, an uncaught exception, a failed request, the error page or an empty heading. Chromium
      # only, without its apt packages (above); a few retries for the browser download.
      - name: Install Chromium for the smoke test
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Smoke-test the site on its own data (Chromium)
        env:
          E2E_LIVE: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx playwright test --project=chromium

      - name: Upload the smoke test's report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record what is deployed
        id: record
        run: |
          built_at=$(python3 -c 'import json; print(json.load(open("dist/data/meta.json"))["built_at"])')
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Unlike preview-only tests, these requests check the publicly published URL.
      # They fail the release if a deep link or static JSON is missing after deployment.
      - name: Verify published site and deep links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILT_AT: ${{ needs.build.outputs.built_at }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}/"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for route in "" "insights/" "legislation/" "votes/" "people/" "countries/" "data/meta.json"; do
            echo "Checking ${base}${route}"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --output "$tmp" "${base}${route}"
            if [[ "$route" == "data/meta.json" ]]; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["counts"]["dossiers"] > 0; assert d["counts"]["ep_votes"] > 0' "$tmp"
            else
              grep -q '<title>' "$tmp"
              if [[ "$route" == "insights/" ]]; then
                grep -q 'Data insights' "$tmp"
              fi
            fi
          done
          # The deployment is live once data/meta.json says it was built when this run built it: Pages had served the
          # previous one from its 10-minute cache (the query string gets past it), and new files take a while to reach
          # every server. A deployment the public URL does not serve fails the release.
          attempts=${VERIFY_ATTEMPTS:-30}
          for attempt in $(seq 1 "$attempts"); do
            live=$(curl --fail --silent --show-error --location \
              "${base}data/meta.json?deploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["built_at"])' || true)
            if [ "$live" = "$BUILT_AT" ]; then
              echo "The public URL serves this deployment (data/meta.json built_at $live)."
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::The public URL does not serve this deployment: its data/meta.json says built_at ${live:-?}, not $BUILT_AT."
              exit 1
            fi
            echo "data/meta.json says built_at ${live:-?}, not $BUILT_AT yet (attempt $attempt of $attempts)."
            sleep "${VERIFY_SLEEP:-10}"
          done
          echo "Public site smoke checks passed."
