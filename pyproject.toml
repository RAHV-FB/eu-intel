[project]
name = "eu-intel-pipeline"
version = "0.1.0"
description = "Data pipeline for EU Legislative Intelligence: official EU sources -> normalized snapshot -> static site data"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "lxml>=5.2,<7",
  "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit live official endpoints (deselected by default)"]
addopts = "-m 'not network'"
